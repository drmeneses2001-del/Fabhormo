l":"Via alternativa","color":"fam-androgeno","collapsed":true,"description":"Ruta que llega a DHT sin pasar por testosterona, con 5α-reduccion temprana."},{"id":"grp:11oxo","label":"Androgenos 11-oxigenados","color":"fam-androgeno","collapsed":true,"description":"Androgenos potentes de origen suprarrenal, relevantes en hiperandrogenismo."}],"source":["read:miller2011"]},"questions":[{"id":"q:0001","module":"esteroidogenesis","stem":"Que paso limita la velocidad de toda la esteroidogenesis?","options":["La 21-hidroxilacion por CYP21A2","El transporte de colesterol a la membrana mitocondrial interna por StAR","La aromatizacion por CYP19A1","La oxidacion del 3β-hidroxilo por la 3β-HSD"],"answer":1,"explanation":"El paso limitante no es enzimatico: es la llegada del colesterol al lugar donde trabaja CYP11A1. Por eso las hormonas troficas actuan en minutos sobre StAR.","links":["enz:StAR","rx:col_preg"],"difficulty":1,"source":["read:miller2011"]},{"id":"q:0002","module":"esteroidogenesis","stem":"Por que la zona glomerular de la suprarrenal no puede fabricar cortisol?","options":["Le falta la 21-hidroxilasa","Le falta CYP17A1 y no puede hidroxilar en el carbono 17","Le falta la 3β-HSD","Le falta la aldosterona sintasa"],"answer":1,"explanation":"Sin CYP17A1 la via no puede llegar a 17-hidroxiprogesterona, que es el precursor obligado del cortisol. A cambio, es la unica zona con aldosterona sintasa.","links":["tis:glomerulosa","enz:CYP17A1"],"difficulty":2,"source":["read:miller2011"]},{"id":"q:0003","module":"esteroidogenesis","stem":"En el deficit clasico de 21-hidroxilasa, que explica la virilizacion?","options":["La 21-hidroxilasa fabrica androgenos directamente","El flujo represado se desvia hacia la unica salida libre, la via androgenica","El cortisol bajo estimula el ovario","La aldosterona baja aumenta la testosterona"],"answer":1,"explanation":"Al bloquear la salida hacia cortisol y aldosterona, la 17-hidroxiprogesterona se acumula y el exceso encuentra su unica salida por la 17,20-liasa hacia androstenediona.","links":["cond:def_21oh","rx:17ohprog_a4"],"difficulty":2,"source":["read:speiser2018"]},{"id":"q:0004","module":"esteroidogenesis","stem":"Que distingue el deficit de 11β-hidroxilasa del de 21-hidroxilasa?","options":["La virilizacion, que solo aparece en el de 11β","La hipertension por acumulo de desoxicorticosterona en vez de perdida salina","El cortisol, que es normal en el de 11β","La herencia, que es dominante en el de 11β"],"answer":1,"explanation":"Los dos virilizan, pero en el deficit de 11β-hidroxilasa se acumula desoxicorticosterona, que tiene actividad mineralocorticoide: hay hipertension e hipopotasemia con renina baja.","links":["cond:def_11boh","mol:doc"],"difficulty":2,"source":["read:turcu2015"]},{"id":"q:0005","module":"esteroidogenesis","stem":"Que enzima convierte un androgeno en un estrogeno?","options":["La 17β-HSD1","La 5α-reductasa tipo 2","La aromatasa CYP19A1","La 3β-HSD2"],"answer":2,"explanation":"La aromatasa elimina el carbono 19 y convierte el anillo A en un fenol aromatico. Es el unico paso que cambia de familia hormonal.","links":["enz:CYP19A1","rx:t_e2"],"difficulty":1,"source":["read:miller2011"]},{"id":"q:0006","module":"esteroidogenesis","stem":"En la teoria de las dos celulas del foliculo ovarico, que aporta la granulosa?","options":["CYP17A1 para fabricar androgenos","Aromatasa para convertir los androgenos en estrogenos","StAR para transportar colesterol","21-hidroxilasa"],"answer":1,"explanation":"La teca tiene CYP17A1 pero no aromatasa; la granulosa, al reves. Ninguna de las dos produce estradiol por si sola.","links":["tis:teca","tis:granulosa"],"difficulty":2,"source":["read:speroff2020"]},{"id":"q:0007","module":"esteroidogenesis","stem":"Que hace el citocromo b5 sobre CYP17A1?","options":["Le cede electrones para la hidroxilacion","Potencia su actividad 17,20-liasa","La inhibe de forma competitiva","La transporta al reticulo"],"answer":1,"explanation":"El citocromo b5 no aporta electrones: actua como modulador alosterico y desplaza la enzima hacia la actividad liasa. Es lo que diferencia la zona reticular de la fasciculada.","links":["enz:CYB5A","tis:reticular"],"difficulty":3,"source":["read:miller2011"]},{"id":"q:0008","module":"organos","stem":"Una persona 46,XY con deficit de 5α-reductasa tipo 2 presenta al nacer","options":["Genitales masculinos normales","Genitales externos femeninos o ambiguos con estructuras wolffianas normales","Ausencia de testiculos","Genitales femeninos con utero"],"answer":1,"explanation":"La testosterona mantiene los conductos de Wolff, pero la virilizacion de los genitales externos depende de la dihidrotestosterona. En la pubertad se viriliza por el ascenso de testosterona.","links":["cond:def_5ar2","org:genitales_externos"],"difficulty":2,"source":["read:miller2011"]},{"id":"q:0009","module":"organos","stem":"Que demuestra el deficit de aromatasa en el varon?","options":["Que la testosterona cierra el cartilago de crecimiento","Que el cierre epifisario depende del estrogeno tambien en el varon","Que el estrogeno no interviene en el hueso masculino","Que la hormona de crecimiento es prescindible"],"answer":1,"explanation":"Los varones con deficit de aromatasa o con receptor de estrogenos no funcionante tienen talla alta con epifisis abiertas y osteoporosis, y el estrogeno sustitutivo lo corrige.","links":["cond:def_aromatasa","org:hueso"],"difficulty":2,"source":["read:miller2011"]},{"id":"q:0010","module":"farmacos","stem":"Por que la abiraterona se administra junto con un glucocorticoide?","options":["Para evitar nauseas","Para contener el exceso de mineralocorticoides que produce el bloqueo de la 17α-hidroxilasa","Para potenciar su efecto antitumoral","Para proteger el higado"],"answer":1,"explanation":"Al bloquear CYP17A1 sube la ACTH y se acumulan precursores con actividad mineralocorticoide, con hipertension, hipopotasemia y edema. El glucocorticoide frena la ACTH.","links":["drug:abiraterona","enz:CYP17A1"],"difficulty":2,"source":["read:turcu2015"]},{"id":"q:0011","module":"farmacos","stem":"Que diferencia farmacologica explica la potencia del etinilestradiol frente al estradiol?","options":["Su mayor afinidad por el receptor de progesterona","El grupo etinilo en el carbono 17, que impide su oxidacion por la 17β-HSD2","Su union a la SHBG","Su metabolismo renal"],"answer":1,"explanation":"El etinilo bloquea la inactivacion en la posicion 17 y prolonga mucho la semivida, con un efecto hepatico de primer paso muy marcado.","links":["drug:etinilestradiol","enz:HSD17B2"],"difficulty":2,"source":["read:stanczyk2013"]},{"id":"q:0012","module":"farmacos","stem":"Que progestageno tiene actividad antimineralocorticoide?","options":["Levonorgestrel","Noretisterona","Drospirenona","Acetato de medroxiprogesterona"],"answer":2,"explanation":"La drospirenona deriva de la espironolactona y conserva su antagonismo del receptor mineralocorticoide, ademas de ser antiandrogenica.","links":["drug:drospirenona","rec:MR"],"difficulty":2,"source":["read:sitrukware2004"]},{"id":"q:0013","module":"elegibilidad","stem":"Que categoria de la OMS corresponde al anticonceptivo combinado en una mujer con migrana con aura?","options":["Categoria 1","Categoria 2","Categoria 3","Categoria 4"],"answer":3,"explanation":"Es categoria 4, es decir, riesgo inaceptable, por el aumento del riesgo de ictus isquemico. Los metodos de solo gestageno son una alternativa.","links":[],"difficulty":2,"source":["read:oms2015"]},{"id":"q:0014","module":"ciclo","stem":"Que desencadena el pico ovulatorio de LH?","options":["La caida de la progesterona","El estradiol sostenido por encima de un umbral, que invierte la retroalimentacion a positiva","El ascenso de la FSH","La inhibina B"],"answer":1,"explanation":"Es el unico momento del ciclo en que el estradiol estimula en vez de frenar. Requiere una concentracion mantenida durante alrededor de dos dias.","links":["mol:estradiol"],"difficulty":2,"source":["read:speroff2020"]},{"id":"q:0015","module":"ciclo","stem":"Que confirma que ha habido ovulacion en un ciclo?","options":["Un estradiol elevado en fase folicular","Una progesterona en fase lutea media por encima de 3 ng/mL","Una LH basal elevada","Un grosor endometrial de 8 mm"],"answer":1,"explanation":"La progesterona solo la produce el cuerpo luteo, que solo existe si ha habido ovulacion.","links":["lab:progesterona"],"difficulty":1,"source":["read:speroff2020"]},{"id":"q:0016","module":"laboratorio","stem":"Que relacion analitica orienta al deficit de 3β-HSD2?","options":["Testosterona / dihidrotestosterona","17-hidroxipregnenolona / 17-hidroxiprogesterona","Aldosterona / renina","Androstenediona / testosterona"],"answer":1,"explanation":"El bloqueo impide pasar de la serie Δ5 a la Δ4, de modo que se acumulan los precursores Δ5 con respecto a sus equivalentes Δ4.","links":["cond:def_3bhsd","lab:17oh_pregnenolona"],"difficulty":3,"source":["read:miller2011"]},{"id":"q:0017","module":"atlas","stem":"Que cambio estructural convierte la testosterona en dihidrotestosterona?","options":["La aromatizacion del anillo A","La reduccion del doble enlace Δ4 del anillo A","La hidroxilacion en el carbono 17","La perdida del carbono 19"],"answer":1,"explanation":"La 5α-reductasa satura el doble enlace entre los carbonos 4 y 5. La composicion apenas cambia, pero la afinidad por el receptor y la duracion del efecto suben mucho.","links":["rx:t_dht","mol:dht"],"difficulty":1,"source":["read:miller2011"]},{"id":"q:0018","module":"atlas","stem":"Que tienen en comun todos los estrogenos naturales?","options":["Un grupo cetona en el carbono 3","Un anillo A aromatico y ausencia del carbono 19","Una cadena lateral de dos carbonos en el 17","Un doble enlace Δ4"],"answer":1,"explanation":"La aromatizacion del anillo A obliga a perder el metilo del carbono 19 y convierte el hidroxilo del carbono 3 en fenol.","links":["mol:estradiol","enz:CYP19A1"],"difficulty":1,"source":["read:miller2011"]},{"id":"q:0019","module":"esteroidogenesis","stem":"De donde procede el estriol que se mide en la gestacion?","options":["Del ovario materno","De la unidad fetoplacentaria, a partir de precursores 16α-hidroxilados de origen fetal","Del higado materno","De la suprarrenal materna en exclusiva"],"answer":1,"explanation":"La placenta no tiene CYP17A1 y depende del sulfato de DHEA fetal, que el higado del feto 16α-hidroxila; la placenta lo desulfata y lo aromatiza.","links":["rx:16ohdhea_e3","tis:sincitiotrofoblasto"],"difficulty":3,"source":["read:miller2011"]},{"id":"q:0020","module":"farmacos","stem":"Que ocurre con la espermatogenesis al administrar testosterona exogena?","options":["Mejora, por el aporte de sustrato","Se suprime, porque cae la concentracion intratesticular al frenarse la LH","No se modifica","Solo se afecta con dosis muy altas"],"answer":1,"explanation":"La espermatogenesis necesita concentraciones intratesticulares muy superiores a las plasmaticas, que solo mantiene la produccion propia estimulada por LH.","links":["org:testiculo","drug:enantato_testosterona"],"difficulty":2,"source":["read:handelsman2020"]}],"reactions":[{"id":"rx:col_preg","substrate":"mol:colesterol","product":"mol:pregnenolona","enzyme":"enz:CYP11A1","activity":"scc","kind":"escision_cadena","series":"comun","compartment":"mitocondria_membrana_interna","cofactors":["NADPH","FDX1","FDXR"],"reversible":false,"tissues":["tis:leydig","tis:teca","tis:cuerpo_luteo","tis:fasciculada","tis:reticular","tis:glomerulosa","tis:sincitiotrofoblasto"],"note":"Tres oxidaciones sucesivas cortan la cadena lateral entre C20 y C22 y liberan isocaproaldehido. Es el paso limitante de toda la esteroidogenesis.","altEnzymes":[],"weight":1,"source":["read:miller2011"],"atomMap":{"pairs":[[5,0],[6,1],[8,3],[9,4],[10,5],[11,6],[12,7],[13,8],[14,9],[15,10],[16,11],[17,12],[18,13],[19,14],[20,15],[21,16],[22,17],[23,18],[24,19],[25,20],[26,21],[27,22]],"removed":[0,1,2,3,4,7],"added":[2]}},{"id":"rx:preg_
